<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b3a2a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Raga Royale">
<meta name="description" content="Raga Royale: roll the dice and let the raga decide. A practice companion for Hindustani classical ragas.">
<script>
/* Landscape draws the app at 820 x 560 and scales it to the window; these three numbers feed that CSS. */
(function(){var r=document.documentElement;function f(){var w=innerWidth,h=innerHeight;r.style.setProperty("--vw",w);r.style.setProperty("--vh",h);r.style.setProperty("--z",Math.min(w/820,h/560).toFixed(4))}f();addEventListener("resize",f);addEventListener("orientationchange",function(){setTimeout(f,250)})})();
</script>
<title>Raga Royale</title>
<style>
:root{
  --slab:"Rockwell","Rockwell Nova","Roboto Slab","Zilla Slab","Clarendon",Georgia,"Noto Serif",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --felt:#0b3a2a;--felt2:#06241a;--ivory:#f7efd9;--cream:#f5ead0;--ink:#1a110d;
  --red:#c8202e;--red2:#e23342;--brass:#e0b04c;--bulb:#ffcf5a;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--felt2)}
body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:14px 16px 44px;font-family:var(--sans);color:var(--ivory);
  background:
    radial-gradient(120% 60% at 50% 30%,rgba(255,255,255,.11),transparent 62%),
    radial-gradient(100% 50% at 50% 115%,rgba(0,0,0,.6),transparent 70%),
    repeating-linear-gradient(45deg,rgba(0,0,0,.055) 0 2px,transparent 2px 5px),
    var(--felt);
  background-attachment:fixed}
.app{width:min(520px,100%)}
button{font-family:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- marquee bulbs ---------- */
.bulbs{position:relative;height:12px;margin:0 6px}
.bulbs::before,.bulbs::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle,#fff6c8 0 2.4px,var(--bulb) 3px 4.4px,transparent 5.4px) 50% 50%/22px 12px repeat-x;
  filter:drop-shadow(0 0 3px rgba(255,200,80,.95));animation:chase 1s steps(1) infinite}
.bulbs::after{background-position:calc(50% + 11px) 50%;animation-delay:-.5s}
@keyframes chase{0%{opacity:1}50%{opacity:.22}}
.win .bulbs::before,.win .bulbs::after{animation-duration:.22s}

/* ---------- sign ---------- */
.sign{padding:10px 8px 12px;border-radius:16px;text-align:center;
  background:linear-gradient(#b3202c,#730f18);border:3px solid var(--brass);
  box-shadow:0 0 0 3px #3a2410,0 14px 30px rgba(0,0,0,.5),inset 0 0 24px rgba(0,0,0,.35)}
.sign h1{margin:6px 0 2px;font:800 clamp(26px,8vw,34px)/1.05 var(--slab);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.4),0 0 18px rgba(255,207,90,.45)}
.sign p{margin:0 0 7px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#ffd9a8}
.sound-toggle{display:inline-flex;align-items:center;gap:7px;margin:1px auto 2px;padding:5px 11px;border:1px solid rgba(224,176,76,.68);border-radius:999px;background:rgba(35,17,10,.38);color:#ffe2a5;font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.sound-toggle[aria-pressed="false"]{color:#b9a98c;border-color:rgba(247,239,217,.28);opacity:.82}
.sound-toggle:focus-visible{outline:2px solid var(--bulb);outline-offset:3px}

/* ---------- poker chips (pool picker) ---------- */
.chips{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:8px;margin:18px 0 4px;align-items:start}
.chip{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;opacity:.8;transition:opacity .15s}
.chip[aria-pressed=true]{opacity:1}
.disc{width:100%;max-width:84px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;
  background:var(--c);
  background:repeating-conic-gradient(from -11deg,#f7efd9 0 22deg,var(--c) 22deg 45deg);
  box-shadow:0 5px 0 rgba(0,0,0,.5),0 10px 14px rgba(0,0,0,.4);transition:transform .16s cubic-bezier(.3,1.5,.5,1),box-shadow .16s}
.disc::before{content:"";position:absolute;inset:13%;border-radius:50%;
  background:var(--c);background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--c) 72%,#fff),var(--c) 72%);
  border:2px dashed rgba(247,239,217,.8)}
.disc b{position:relative;font:800 20px/1 var(--slab);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.chip:active .disc{transform:translateY(3px)}
.chip[aria-pressed=true] .disc{transform:translateY(-8px) scale(1.07);box-shadow:0 13px 0 rgba(0,0,0,.4),0 0 0 3px var(--brass),0 0 24px rgba(224,176,76,.65)}
.cl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;line-height:1.25;text-align:center;text-wrap:balance}

/* ---------- the big dice ---------- */
.arena{--d:clamp(130px,46vw,196px);position:relative;height:calc(var(--d)*1.5);display:grid;place-items:center;margin-top:6px}
.shadow{position:absolute;bottom:calc(var(--d)*.12);width:calc(var(--d)*.95);height:calc(var(--d)*.2);border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%)}
.hop{position:relative;will-change:transform}
.dicebtn{display:block;background:none;border:0;padding:0;cursor:pointer;border-radius:20%}
.dicebtn:focus-visible{outline:3px solid var(--brass);outline-offset:10px}
.dicebtn:disabled{cursor:default}
.scene{width:var(--d);height:var(--d);perspective:900px}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;border-radius:17%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:15%;
  background:radial-gradient(circle at 28% 22%,#f0525d 0,#cf2433 38%,#8f111c 100%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.14),inset 0 0 26px rgba(60,0,6,.55)}
.pip{place-self:center;width:74%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0,#f4e8c9 55%,#c9b78a 100%);
  box-shadow:inset 0 -3px 4px rgba(0,0,0,.35),0 1px 1px rgba(255,255,255,.2)}
.pip.one{width:104%}

/* ---------- reel machine ---------- */
.machine{position:relative;margin-top:10px;padding:10px 12px 12px;border-radius:20px;
  background:linear-gradient(#2c1a12,#170d09);border:3px solid var(--brass);
  box-shadow:0 0 0 3px #3a2410,0 18px 40px rgba(0,0,0,.55),inset 0 0 30px rgba(0,0,0,.6)}
.plate{display:block;width:max-content;max-width:100%;margin:10px auto 10px;padding:5px 16px;border-radius:8px;
  background:linear-gradient(#f6d98a,#b78a2c);color:#2a1a0a;font:800 12px/1.2 var(--sans);letter-spacing:.18em;text-transform:uppercase;text-align:center;
  box-shadow:0 2px 0 #5a3d12,inset 0 1px 0 rgba(255,255,255,.5)}
.win .plate{animation:glow .22s steps(1) 5}
@keyframes glow{0%{filter:brightness(1.5)}50%{filter:none}}

.reel{--rh:54px;position:relative;height:calc(var(--rh)*3);overflow:hidden;border-radius:10px;background:var(--cream);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.5),0 0 0 2px #0008;cursor:pointer}
.reel.r1{--rh:58px;height:var(--rh);cursor:default}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.reel.spinning .strip{filter:blur(1.4px)}
.it{height:var(--rh);display:flex;align-items:center;justify-content:center;padding:0 22px;font-family:var(--slab);font-weight:800;color:var(--ink);white-space:nowrap}
.it.ph{font-size:19px;letter-spacing:.14em;text-transform:uppercase;color:#85704d;font-weight:700}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:
    linear-gradient(rgba(30,16,8,.4),transparent 20%,transparent 80%,rgba(30,16,8,.4)),
    linear-gradient(to bottom,rgba(245,234,208,.84) 0,rgba(245,234,208,.84) calc(var(--rh)*.8),rgba(245,234,208,0) var(--rh),rgba(245,234,208,0) calc(var(--rh)*2),rgba(245,234,208,.84) calc(var(--rh)*2.2),rgba(245,234,208,.84) 100%)}
.reel.r1::after{background:linear-gradient(rgba(30,16,8,.32),transparent 22%,transparent 78%,rgba(30,16,8,.32))}
.reel.r3::before{content:"";position:absolute;left:16px;right:16px;top:var(--rh);height:var(--rh);border-block:2px solid rgba(200,32,46,.4);pointer-events:none;z-index:2}
.pl{position:absolute;top:50%;width:0;height:0;border:9px solid transparent;transform:translateY(-50%);z-index:3}
.pl.l{left:0;border-left-color:var(--red);border-right-width:0}
.pl.r{right:0;border-right-color:var(--red);border-left-width:0}
.win .pl{animation:glow .22s steps(1) 5}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:11px;min-height:25px}
.tags span{font-size:12px;padding:4px 11px;border-radius:99px;border:1px solid rgba(247,239,217,.35);color:var(--ivory)}
.mrow{margin-bottom:10px}
.mrow:last-child{margin-bottom:0}
.mlabel{display:block;margin:0 2px 5px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}

.progress{text-align:center;color:#9cc7b3;font-size:13px;margin:12px 0;min-height:18px}
.progress button{border:0;background:none;color:var(--brass);font-size:13px;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- buttons ---------- */
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.alt{padding:13px;border-radius:14px;border:2px solid rgba(247,239,217,.45);background:rgba(0,0,0,.18);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.alt:active:not(:disabled){background:rgba(247,239,217,.14)}
.alt:disabled{opacity:.5}

/* ---------- history tickets ---------- */
.history{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;justify-content:center}
.history .cap{flex-basis:100%;text-align:center;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9cc7b3}
.history button{border:0;padding:8px 14px;font:700 13px var(--slab);color:#2a1a0f;cursor:pointer;
  background:radial-gradient(circle at 0 50%,transparent 5px,#f7efd9 5.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 5px,#f7efd9 5.5px) right/51% 100% no-repeat}

/* ---------- season ---------- */
.season{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px;padding:12px 14px;border-radius:16px;
  background:linear-gradient(#2c1a12,#170d09);border:2px solid rgba(224,176,76,.6)}
.season b{display:block;font-size:14px;letter-spacing:.04em}
.season small{display:block;color:#b9a98c;font-size:12px;margin-top:3px;line-height:1.3}
.seg{display:flex;flex:none;gap:4px}
.seg button{border:2px solid rgba(247,239,217,.3);background:rgba(0,0,0,.25);padding:7px 10px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer}
.seg button[aria-pressed=true]{background:linear-gradient(var(--red2),#a5141f);border-color:var(--brass);box-shadow:0 0 12px rgba(226,51,66,.5)}

/* ---------- list ---------- */
#listWrap{margin-top:18px}
#q{width:100%;padding:13px 16px;border-radius:14px;border:2px solid rgba(247,239,217,.35);background:rgba(0,0,0,.3);color:var(--ivory);font-size:16px;font-family:inherit;outline:none}
#q:focus{border-color:var(--brass)}
#q::placeholder{color:#8aa89a}
.sec{margin-top:18px}
.sec h3{margin:0 0 8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
.sec h3 em{font-style:normal;font-size:14px;margin-right:6px}
.sec h3 span{color:#9cc7b3;margin-left:6px}
.items{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.items button{text-align:left;padding:9px 12px;border-radius:10px;border:1px solid rgba(247,239,217,.2);background:rgba(247,239,217,.07);font-size:14px;cursor:pointer}
.items button:active{background:var(--red)}
.note{color:#9cc7b3;font-size:12.5px;margin:16px 2px 0;line-height:1.4}
.count{margin-top:24px;text-align:center;color:#7fa593;font-size:13px}
.spark{position:fixed;width:7px;height:11px;border-radius:2px;pointer-events:none;z-index:50}
@media(max-width:400px){.items{grid-template-columns:1fr}.seg button{padding:7px 8px}}
@media(prefers-reduced-motion:reduce){.bulbs::before,.bulbs::after{animation:none}}


/* ---------- compact casino cabinet: keep the main play display in view ---------- */
@media(max-height:1180px){
  body{padding:4px 8px 3px}
  .bulbs{height:8px;margin-inline:5px}
  .sign{padding:7px 8px 8px;border-radius:14px}
  .sign h1{font-size:clamp(25px,7vw,30px);margin:3px 0 1px}
  .sign p{font-size:10px;margin:0 0 4px}
  .sound-toggle{margin:0 auto 1px;padding:4px 10px;font-size:9px}
  .chips{gap:6px;margin:10px 0 2px}
  .chip{gap:6px}
  .disc{max-width:64px}
  .disc b{font-size:17px}
  .cl{font-size:9px;line-height:1.2}
  .arena{--d:clamp(94px,14vh,112px);height:calc(var(--d)*1.12);margin-top:0}
  .machine{margin-top:8px;padding:6px 8px 7px;border-radius:17px}
  .machine>.bulbs:last-child{margin-top:8px!important}
  .plate{margin:5px auto 6px;padding:4px 12px;font-size:10px}
  .reel{--rh:41px}
  .reel.r1{--rh:45px}
  .tags{gap:5px;margin-top:8px;min-height:21px}
  .tags span{font-size:11px;padding:3px 9px}
  .progress{font-size:12px;margin:7px 0;min-height:16px}
  .row{gap:8px;margin-top:8px}
  .alt{padding:10px;border-radius:12px;font-size:12px}
  .history{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;margin-top:10px}
  .history::-webkit-scrollbar{display:none}
  .history .cap{flex:0 0 auto;align-self:center;font-size:10px}
  .history button{flex:0 0 auto;padding:6px 10px;font-size:12px}
  .season{gap:8px;margin-top:10px;padding:8px 10px;border-radius:14px}
  .season b{font-size:12px}
  .season small{font-size:10px;line-height:1.2}
  .seg{gap:3px}
  .seg button{padding:6px 8px;font-size:11px}
  .count{margin-top:8px;font-size:11px}
  #mix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .mrow{min-width:0;margin-bottom:0}
  .mlabel{font-size:10px;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #listWrap{max-height:34vh;overflow-y:auto;overscroll-behavior:contain}
}
@media(max-height:680px){
  body{padding:3px 8px 1px}
  .sign{padding:5px 6px 6px}
  .bulbs{height:6px}
  .sign h1{font-size:clamp(22px,6vw,26px);margin:2px 0 1px}
  .sign p{font-size:9px;margin-bottom:3px}
  .sound-toggle{padding:3px 8px;font-size:8px}
  .chips{gap:4px;margin:7px 0 1px}
  .chip{gap:4px}
  .disc{max-width:55px}
  .disc b{font-size:15px}
  .cl{font-size:8px}
  .arena{--d:clamp(84px,13vh,96px);height:calc(var(--d)*1.08)}
  .machine{margin-top:6px;padding:4px 6px 5px}
  .machine>.bulbs:last-child{margin-top:5px!important}
  .plate{margin:3px auto 4px;padding:3px 10px;font-size:9px}
  .reel{--rh:33px}
  .reel.r1{--rh:37px}
  .tags{margin-top:5px;min-height:17px;gap:4px}
  .tags span{font-size:10px;padding:2px 7px}
  .progress{font-size:11px;margin:5px 0;min-height:14px}
  .row{gap:6px;margin-top:5px}
  .alt{padding:7px;font-size:11px}
  .history{margin-top:7px;gap:5px}
  .history .cap{font-size:9px}
  .history button{padding:5px 8px;font-size:11px}
  .season{margin-top:6px;padding:5px 7px;gap:6px}
  .season b{font-size:11px}
  .season small{display:none}
  .seg button{padding:5px 6px;font-size:10px}
  .count{margin-top:4px;font-size:10px}
  #listWrap{max-height:30vh}
}
@media(max-height:600px) and (max-width:360px){
  body{padding:2px 6px 0}
  .sign{padding:3px 5px 4px;border-radius:12px}
  .bulbs{height:5px}
  .sign h1{font-size:21px;letter-spacing:.1em;margin:1px 0}
  .sign p{font-size:8px;letter-spacing:.12em;margin-bottom:2px}
  .sound-toggle{padding:2px 7px;font-size:7px}
  .chips{gap:3px;margin:5px 0 0}
  .chip{gap:3px}
  .disc{max-width:43px}
  .disc b{font-size:12px}
  .cl{font-size:7px;line-height:1.1}
  .arena{--d:84px;height:88px}
  .machine{margin-top:4px;padding:4px 5px}
  .machine>.bulbs:last-child{margin-top:4px!important}
  .plate{margin:2px auto 3px;padding:3px 8px;font-size:8px}
  .reel{--rh:31px}
  .reel.r1{--rh:32px}
  .tags{gap:3px;margin-top:4px;min-height:14px}
  .tags span{font-size:9px;padding:2px 6px}
  .progress{font-size:10px;margin:3px 0;min-height:12px}
  .row{gap:5px;margin-top:4px}
  .alt{padding:6px;font-size:10px}
  .history{gap:4px;margin-top:4px}
  .history .cap{font-size:8px}
  .history button{padding:4px 6px;font-size:9px}
  .season{margin-top:4px;padding:4px 6px;gap:5px}
  .season b{font-size:9px}
  .seg button{padding:4px 5px;font-size:9px}
  .count{display:none}
  #mix{gap:5px}
  .mlabel{font-size:8px;letter-spacing:.08em}
  #mix .it{font-size:clamp(12px,4vw,14px)!important;letter-spacing:0}
  #listWrap{max-height:26vh}
}


/* ---------- fitted mobile cabinet: balanced scale, no dead space ---------- */
@media(max-width:600px){
  body{padding:3px 8px 4px}
  .app{
    display:flex;flex-direction:column;justify-content:space-between;
    gap:clamp(5px,1vh,9px);
    min-height:calc(100vh - 7px);
  }
  @supports(height:100dvh){.app{min-height:calc(100dvh - 7px)}}
  .app>:not(.sr):not([hidden]){flex:0 0 auto}

  /* A slightly smaller marquee and pool row, with breathing room between them. */
  .sign{padding:6px 7px 7px;border-radius:14px}
  .bulbs{height:7px;margin-inline:5px}
  .sign h1{font-size:clamp(23px,6.3vw,28px);letter-spacing:.12em;margin:3px 0 1px}
  .sign p{font-size:9.5px;letter-spacing:.14em;margin:0 0 4px}
  .sound-toggle{padding:4px 9px;font-size:8.5px;margin:0 auto 1px}

  .chips{gap:5px;margin:8px 0 2px}
  .chip{gap:6px}
  .disc{max-width:59px}
  .disc b{font-size:16px}
  .cl{font-size:8.7px;line-height:1.2;letter-spacing:.055em}

  /* The die is reduced independently; its arena keeps a little clear space above the reel. */
  .arena{--d:clamp(86px,12.5vh,101px);height:calc(var(--d)*1.2);margin:1px 0 0}
  .machine{margin-top:12px;padding:6px 8px 7px;border-radius:17px}
  .machine>.bulbs:last-child{margin-top:7px!important}
  .plate{margin:4px auto 5px;padding:4px 11px;font-size:9.5px}
  .reel{--rh:38px}
  .reel.r1{--rh:42px}
  .it.ph{font-size:16px;letter-spacing:.1em}
  .tags{gap:5px;margin-top:7px;min-height:19px}
  .tags span{font-size:10px;padding:3px 8px}

  .progress{font-size:11px;margin:5px 0;min-height:14px}
  .progress button{font-size:11px}
  .row{gap:7px;margin-top:4px}
  .alt{padding:9px 7px;border-radius:12px;font-size:11px}
  .history{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;gap:5px;margin-top:7px}
  .history::-webkit-scrollbar{display:none}
  .history .cap{flex:0 0 auto;align-self:center;font-size:9px}
  .history button{flex:0 0 auto;padding:6px 9px;font-size:11px}
  .season{gap:7px;margin-top:8px;padding:7px 9px;border-radius:13px}
  .season b{font-size:11px}
  .season small{font-size:9.5px;line-height:1.15}
  .seg{gap:3px}
  .seg button{padding:5px 7px;font-size:10px}

  #mix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .mrow{min-width:0;margin-bottom:0}

/* In the 3-pool version of Today's Mix, centre the Light field beneath
   the two timed classical pools. Seasonal mode stays a balanced 2x2 grid. */
#mix.mix-three .mrow:last-child{
  width:min(58%,320px);
  margin-inline:auto;
  grid-column:1 / -1;
  justify-self:center;
}
#mix.mix-three .mrow:last-child .mlabel{text-align:center}

/* Today's Mix only: compact result names so long raga names stay inside each tile.
   The standard single-raga reel is deliberately unchanged. */

/* =====================================================================
   PACKAGING ADDITIONS (portrait is untouched by everything below)
   ===================================================================== */

/* The two panes only exist for the landscape layout. Everywhere else they are
   invisible wrappers, so the portrait layout above behaves exactly as before. */
.pane-l,.pane-r{display:contents}
.list-close{display:none}
@media(max-width:600px){
  /* keeps the original "never shrink" rule working now that the items sit inside a pane */
  .pane-l>:not(.sr):not([hidden]),.pane-r>:not(.sr):not([hidden]){flex:0 0 auto}
}

/* =====================================================================
   LANDSCAPE: two panels, scaled to fit any landscape screen (iPad etc.)
   Left panel  = marquee, pool chips, the big dice
   Right panel = reel machine, buttons, recent, season
   The Raga list slides in over the right panel instead of pushing the page.
   The layout is drawn at 820 x 560 and scaled by --z (set by the script in <head>).
   ===================================================================== */

    padding:12px max(24px,calc((var(--vw,820)*1px / var(--z,1) - 1060px)/2));   /* on very wide windows the panels stay centred at ~1060 */

  /* ----- right panel ----- */

  .plate{margin:7px auto;padding:5px 16px;font-size:12px}

  .reel.r1{--rh:72px}

  /* Today's Mix: tidy 2x2 tiles (3 pools: the Light tile is centred underneath) */

/* ---------- pools ---------- */
const seasonOk=r=>!r.season||r.season===st.season;
const members=p=>ALL.filter(r=>seasonOk(r)&&(p==="all"||(p==="season"?!!r.season:r.pools.includes(p))));
const poolKeys=()=>["day","night","light","all"].concat(st.season!=="off"?["season"]:[]);
const curPool=()=>poolKeys().includes(st.pool)?st.pool:"day";
const chipLabel=p=>p==="season"?SEASON_NAME[st.season]+" ragas":LABEL[p];
const leftIn=p=>{const pl=new Set(st.played[p]||[]);return members(p).filter(r=>!pl.has(r.name)).length};
const tagsOf=r=>{
  const t=r.pools.map(p=>LABEL[p]);
  if(r.season)t.push(SEASON_NAME[r.season]);
  if(!t.length)t.push("Not sorted yet");
  return t;
};
const names=p=>members(p).map(r=>r.name);
/* Today's Mix keeps light-classical ragas in the dedicated Light field only.
   The regular Day/Night pool selectors remain unchanged. */
const mixMembers=p=>{
  const m=members(p);
  return (p==="day"||p==="night")?m.filter(r=>!r.pools.includes("light")):m;
};
const mixNames=p=>mixMembers(p).map(r=>r.name);
const rnd=a=>a[Math.floor(Math.random()*a.length)];

/* shuffle bag: every raga in a pool comes up once before any repeats */
function draw(p,eligible=members(p)){
  const m=eligible;if(!m.length)return null;
  let played=new Set(st.played[p]||[]);
  let left=m.filter(r=>!played.has(r.name));
  let reshuffled=false;
  if(!left.length){
    played=new Set();left=m.slice();reshuffled=true;
    if(left.length>1)left=left.filter(r=>r.name!==st.history[0]);
  }
  const r=rnd(left);
  played.add(r.name);
  st.played[p]=[...played];
  return {r,reshuffled};
}
function pushHistory(list){
  list.forEach(n=>{st.history=st.history.filter(x=>x!==n);st.history.unshift(n)});
  st.history=st.history.slice(0,8);
}

/* ---------- slot reel ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fit=n=>Math.max(17,Math.min(34,Math.floor(290/(n.length*.56))));
/* a leading "~" marks placeholder text */
const itemHTML=n=>n[0]==="~"?`<div class="it ph">${esc(n.slice(1))}</div>`:`<div class="it" style="font-size:${fit(n)}px">${esc(n)}</div>`;

class Reel{
  constructor(host,vis){this.host=host;this.vis=vis;this.off=(vis-1)/2;this.strip=host.querySelector(".strip");this.cur=[]}
  get rh(){return parseFloat(getComputedStyle(this.host).getPropertyValue("--rh"))||54}
  show(list){
    this.cur=list.slice();
    this.strip.innerHTML=list.map(itemHTML).join("");
    this.strip.style.transform="translateY(0px)";
  }
  async spin(final,pool,dur,fillN){
    const rh=this.rh,off=this.off,pick=()=>rnd(pool);
    const seq=this.cur.slice();
    let prev=seq[seq.length-1];
    for(let i=0;i<fillN;i++){let n,t=0;do{n=pick()}while(pool.length>1&&n===prev&&t++<6);seq.push(n);prev=n}
    for(let i=0;i<off;i++)seq.push(pick());
    seq.push(final);
    for(let i=0;i<off;i++)seq.push(pick());
    const fi=seq.length-1-off;
    this.strip.innerHTML=seq.map(itemHTML).join("");
    const end=-(fi-off)*rh,over=end-Math.round(rh*.3);
    this.strip.style.transform="translateY(0px)";
    if(!reduced)this.host.classList.add("spinning");
    const a=this.strip.animate([
      {transform:"translateY(0px)",easing:"cubic-bezier(.25,.7,.2,1)"},
      {transform:`translateY(${over}px)`,offset:.9,easing:"ease-in-out"},
      {transform:`translateY(${end}px)`}
    ],{duration:dur,fill:"forwards"});
    const t=setTimeout(()=>this.host.classList.remove("spinning"),dur*.62);
    try{await a.finished}catch(e){}
    clearTimeout(t);this.host.classList.remove("spinning");
    a.cancel();
    this.show(seq.slice(fi-off,fi+off+1));
  }
}

/* ---------- the big dice ---------- */
const cube=$("cube"),hop=$("hop"),shadow=$("shadow"),scene=cube.parentElement;
const FACES={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const Z="translateZ(calc(var(--d)/2))";
const PLACE={1:Z,6:"rotateY(180deg) "+Z,2:"rotateY(90deg) "+Z,5:"rotateY(-90deg) "+Z,3:"rotateX(90deg) "+Z,4:"rotateX(-90deg) "+Z};
/* rotation [x,y] that brings face n toward the viewer */
const FACEROT={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};
cube.innerHTML=[1,2,3,4,5,6].map(n=>`<div class="face" style="transform:${PLACE[n]}">${FACES[n].map(i=>`<i class="pip${n===1?" one":""}" style="grid-area:${Math.floor(i/3)+1}/${i%3+1}"></i>`).join("")}</div>`).join("");
let ang={x:0,y:180,z:0};
const cubeT=a=>`rotateX(-24deg) rotateY(-30deg) rotateX(${a.x}deg) rotateY(${a.y}deg) rotateZ(${a.z}deg)`;
cube.style.transform=cubeT(ang);
const nextAng=(cur,base)=>base+360*Math.ceil((cur+720-base)/360)+360*Math.floor(Math.random()*2);

async function tumble(face,dur){
  const [bx,by]=FACEROT[face];
  const to={x:nextAng(ang.x,bx),y:nextAng(ang.y,by),z:ang.z+360*(1+Math.floor(Math.random()*2))};
  const anims=[cube.animate([{transform:cubeT(ang)},{transform:cubeT(to)}],{duration:dur,easing:"cubic-bezier(.25,.6,.3,1)",fill:"forwards"})];
  ang=to;
  if(!reduced){
    const d=scene.offsetWidth;
    const T=(x,y,s)=>`translateX(${x*d}px) translateY(${-y*d}px) scale(${s})`;
    anims.push(hop.animate([
      {transform:T(-.28,0,1),offset:0,easing:"ease-out"},
      {transform:T(-.14,.6,1.2),offset:.28,easing:"ease-in"},
      {transform:T(-.05,0,1),offset:.55,easing:"ease-out"},
      {transform:T(-.02,.2,1.06),offset:.72,easing:"ease-in"},
      {transform:T(0,0,1),offset:.86,easing:"ease-out"},
      {transform:T(0,.05,1.01),offset:.94,easing:"ease-in"},
      {transform:T(0,0,1),offset:1}
    ],{duration:dur,fill:"forwards"}));
    const S=(sx,o)=>({transform:`translateX(${0}px) scaleX(${sx})`,opacity:o});
    anims.push(shadow.animate([
      {...S(1,1),offset:0},{...S(.6,.45),offset:.28},{...S(1,1),offset:.55},
      {...S(.85,.8),offset:.72},{...S(1,1),offset:.86},{...S(.95,.92),offset:.94},{...S(1,1),offset:1}
    ],{duration:dur,fill:"forwards"}));
  }
  await Promise.all(anims.map(a=>a.finished.catch(()=>{})));
  cube.style.transform=cubeT(ang);
  anims.forEach(a=>a.cancel());
  cube.dataset.face=face;
}

const PH=["~♠   ♥   ♦   ♣","~Tap the dice","~♣   ♦   ♥   ♠"];
const showSingle=()=>{$("mix").hidden=true;$("single").hidden=false};
const setPlate=t=>{$("plate").textContent=t};
function idle(){
  showSingle();reel.show(PH);$("tags").innerHTML="";setPlate(chipLabel(curPool()));
}
function showRaga(name,plate){
  const r=byName.get(name);if(!r)return;
  showSingle();
  reel.show([nb(),name,nb()]);
  $("tags").innerHTML=tagsOf(r).map(t=>`<span>${esc(t)}</span>`).join("");
  setPlate(plate||chipLabel(curPool()));
  $("sr").textContent=name;
}

/* ---------- rendering ---------- */
function renderChips(){
  const keys=poolKeys(),p=curPool();
  $("chips").style.setProperty("--n",keys.length);
  $("chips").innerHTML=keys.map(k=>{
    const col=k==="season"?(st.season==="spring"?"#d1527f":"#0f8a8a"):CHIPCOL[k];
    return `<button class="chip" data-p="${k}" aria-pressed="${k===p}" style="--c:${col}"><span class="disc"><b>${members(k).length}</b></span><span class="cl"><em style="font-style:normal;color:${SUITCOL[k]||"#f7efd9"}">${SUIT[k]}</em> ${esc(chipLabel(k))}</span></button>`;
  }).join("");
}
function renderProgress(msg){
  const p=curPool(),total=members(p).length,left=leftIn(p);
  $("progress").innerHTML=`<span>${msg||`${left} of ${total} left in this round`}</span>`+(left<total?` · <button id="reshuf">restart round</button>`:"");
}
function renderHistory(){
  $("history").innerHTML=st.history.length?`<div class="cap">Recent</div>`+st.history.map(n=>`<button data-n="${esc(n)}">${esc(n)}</button>`).join(""):"";
}
function renderSeg(){
  document.querySelectorAll("#seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.s===st.season)));
}
function renderCount(){
  $("count").textContent=`${members("all").length} ragas${st.season==="off"?" • seasonal ragas off":""} • works offline`;
}
function renderList(){
  const q=$("q").value.trim().toLowerCase();
  const hit=r=>!q||r.name.toLowerCase().includes(q);
  const secs=[["day",LABEL.day],["night",LABEL.night],["light",LABEL.light]].map(([k,t])=>[SUIT[k],t,members(k).filter(hit)]);
  if(st.season!=="off")secs.push([SUIT.season,SEASON_NAME[st.season]+" ragas",members("season").filter(hit)]);
  secs.push(["?","Not sorted yet",ALL.filter(r=>!r.pools.length&&!r.season&&hit(r))]);
  let html=secs.filter(s=>s[2].length).map(([g,t,rs])=>`<div class="sec"><h3><em>${g}</em>${t}<span>${rs.length}</span></h3><div class="items">${rs.map(r=>`<button data-n="${esc(r.name)}">${esc(r.name)}</button>`).join("")}</div></div>`).join("");
  if(!html)html=`<p class="note">No raga matches that.</p>`;
  if(st.season==="off")html+=`<p class="note">Malhar, Basant, Bahar and Hindol ragas are hidden. Switch Seasonal ragas on to bring them in.</p>`;
  $("list").innerHTML=html;
}

/* ---------- win effects ---------- */
function burst(){
  if(navigator.vibrate)try{navigator.vibrate(35)}catch(e){}
  if(reduced)return;
  const r=$("machine").getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height*.45;
  const cols=["#f7efd9","#c8202e","#e0b04c","#2f9e6b"];
  for(let i=0;i<28;i++){
    const e=document.createElement("i");e.className="spark";
    e.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%4]}`;
    document.body.appendChild(e);
    const a=Math.random()*Math.PI*2,v=90+Math.random()*160,dx=Math.cos(a)*v,dy=Math.sin(a)*v*.7-50;
    e.animate([
      {transform:"translate(0,0) rotate(0deg)",opacity:1},
      {transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*360}deg)`,opacity:1,offset:.45},
      {transform:`translate(${dx*1.2}px,${dy+230}px) rotate(${Math.random()*720}deg)`,opacity:0}
    ],{duration:1100+Math.random()*500,easing:"cubic-bezier(.2,.6,.4,1)"}).finished.then(()=>e.remove(),()=>e.remove());
  }
  document.body.classList.add("win");
  setTimeout(()=>document.body.classList.remove("win"),1200);
}

/* ---------- rolling ---------- */
let busy=false;
function setBusy(b){
  busy=b;
  ["mixBtn","diceBtn"].forEach(id=>$(id).disabled=b);
}
async function roll(){
  if(busy)return;
  const p=curPool(),res=draw(p);if(!res)return;
  playSfx("roll");
  setBusy(true);showSingle();
  $("tags").innerHTML="";setPlate(chipLabel(p));
  const dur=reduced?500:2100;
  await Promise.all([
    tumble(1+Math.floor(Math.random()*6),dur),
    reel.spin(res.r.name,names(p),dur+350,30)
  ]);
  const r=res.r;
  $("tags").innerHTML=tagsOf(r).map(t=>`<span>${esc(t)}</span>`).join("");
  $("sr").textContent=r.name;
  pushHistory([r.name]);save();renderHistory();
  renderProgress(res.reshuffled?"Round complete, reshuffled":null);
  burst();setBusy(false);
}
async function mix(){
  if(busy)return;
  const keys=["day","night","light"].concat(st.season!=="off"?["season"]:[]);
  const picks=keys.map(p=>({p,res:draw(p,mixMembers(p))})).filter(x=>x.res);
  if(!picks.length)return;
  playSfx(st.season==="off"?"mix":"mixSeason");
  setBusy(true);
  $("single").hidden=true;$("mix").hidden=false;setPlate("Today's Mix");
  $("mix").classList.toggle("mix-three",picks.length===3);
  $("mix").classList.toggle("mix-four",picks.length===4);
  $("mix").innerHTML=picks.map(x=>`<div class="mrow"><span class="mlabel"><em style="font-style:normal;color:${SUITCOL[x.p]||"#e0b04c"}">${SUIT[x.p]}</em> ${esc(chipLabel(x.p))}</span><div class="reel r1"><div class="strip"></div></div></div>`).join("");
  miniReels=[...$("mix").querySelectorAll(".reel")].map(h=>{const r=new Reel(h,1);r.show(["~· · ·"]);return r});
  const base=reduced?400:1900,gap=reduced?100:600;
  await Promise.all([
    tumble(1+Math.floor(Math.random()*6),reduced?500:2300),
    ...picks.map((x,i)=>miniReels[i].spin(x.res.r.name,mixNames(x.p),base+i*gap,22+i*6))
  ]);
  $("sr").textContent=picks.map(x=>x.res.r.name).join(", ");
  pushHistory(picks.map(x=>x.res.r.name).reverse());save();renderHistory();
  renderProgress("Today's Mix: one from each pool");
  burst();setBusy(false);
}

/* ---------- events ---------- */
$("soundToggle").addEventListener("click",()=>{
  soundOn=!soundOn;try{localStorage.setItem(SOUND_KEY,soundOn?"on":"off")}catch(e){}
  if(!soundOn)stopSfx();
  renderSoundToggle();
});

$("diceBtn").addEventListener("click",roll);
$("reel").addEventListener("click",roll);
$("mixBtn").addEventListener("click",mix);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&LAND.matches&&!$("listWrap").hidden){$("listBtn").click();return}
  if(e.code==="Space"&&!/^(INPUT|TEXTAREA|BUTTON)$/.test(e.target.tagName)){e.preventDefault();roll()}
});
$("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b||busy)return;
  st.pool=b.dataset.p;save();renderChips();idle();renderProgress();
});
$("progress").addEventListener("click",e=>{
  if(e.target.id!=="reshuf")return;
  st.played[curPool()]=[];save();renderProgress();
});
$("history").addEventListener("click",e=>{const b=e.target.closest("button");if(b&&!busy)showRaga(b.dataset.n,"Your pick")});
$("list").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||busy)return;
  showRaga(b.dataset.n,"Your pick");$("machine").scrollIntoView({behavior:reduced?"auto":"smooth",block:"center"});
  if(LAND.matches&&!$("listWrap").hidden)$("listBtn").click();   /* landscape: close the slide-over so the pick is visible */
});
$("q").addEventListener("input",renderList);
$("listClose").addEventListener("click",()=>$("listBtn").click());
$("listBtn").addEventListener("click",()=>{
  const w=$("listWrap"),open=w.hidden;
  w.hidden=!open;$("listBtn").textContent=open?"Hide list":"Raga list";
  if(open)renderList();
});
$("seg").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||busy)return;
  st.season=b.dataset.s;
  if(st.pool==="season"&&st.season==="off")st.pool="day";
  save();renderSeg();renderChips();idle();renderProgress();renderCount();
  if(!$("listWrap").hidden)renderList();
});

/* ---------- init ---------- */
renderSeg();renderChips();idle();renderProgress();renderHistory();renderCount();renderSoundToggle();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js"));
}
</script>
</body>
